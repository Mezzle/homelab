# inotify limits — arr apps and Immich watch many files
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=512

# Network tuning for media streaming
net.core.rmem_max=4194304
net.core.wmem_max=4194304

# Immich / Elasticsearch requirement
vm.max_map_count=262144

# Writeback thresholds — the ratio-based defaults (dirty_ratio=20,
# dirty_background_ratio=10) allow ~3GB of dirty pages on a 16GB host,
# which is far more than any single container's cgroup limit. Dirty CIFS
# pages produced by an arr import are charged to that container's cgroup,
# so the cgroup limit was hit long before the kernel started throttling
# the writer, and the app got OOM-killed mid-import. Capping dirty pages
# in absolute terms starts writeback early and throttles the writer, so
# the page cache inside a cgroup stays clean and therefore reclaimable.
# Setting *_bytes disables the corresponding *_ratio knobs.
vm.dirty_bytes=268435456
vm.dirty_background_bytes=134217728
