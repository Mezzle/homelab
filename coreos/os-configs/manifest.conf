###############################################################################
# OS config manifest — maps repo files to system paths
#
# Format: <source> <destination> <mode> [reload-action]
#
# Source paths are relative to coreos/os-configs/. The same files are
# referenced from the Butane configs (contents: local:), so a fresh install
# and gitops-sync install identical content.
#
# Scope by first path component:
#   no directory  — applied to every host
#   common/       — applied to every host
#   <hostname>/   — applied only to that host
#
# Reload actions (optional):
#   sysctl    — sudo sysctl --system
#   docker    — sudo systemctl reload docker
#   sshd      — sudo systemctl reload sshd
#   systemd   — sudo systemctl daemon-reload, then try-restart changed timers.
#               New units still need a one-off `systemctl enable --now`.
###############################################################################

# Shared configs
sysctl-90-arr-tuning.conf                        /etc/sysctl.d/90-arr-tuning.conf                          0644  sysctl
docker-daemon.json                               /etc/docker/daemon.json                                   0644  docker
sshd-50-hardening.conf                           /etc/ssh/sshd_config.d/50-hardening.conf                  0600  sshd

# Shared systemd units
common/stack@.service                            /etc/systemd/system/stack@.service                        0644  systemd
common/gitops-sync.service                       /etc/systemd/system/gitops-sync.service                   0644  systemd
common/gitops-sync.timer                         /etc/systemd/system/gitops-sync.timer                     0644  systemd
common/docker-prune.service                      /etc/systemd/system/docker-prune.service                  0644  systemd
common/docker-prune.timer                        /etc/systemd/system/docker-prune.timer                    0644  systemd
common/container-heartbeat.service               /etc/systemd/system/container-heartbeat.service           0644  systemd
common/container-heartbeat.timer                 /etc/systemd/system/container-heartbeat.timer             0644  systemd
common/backup.service                            /etc/systemd/system/backup.service                        0644  systemd
common/backup.timer                              /etc/systemd/system/backup.timer                          0644  systemd

# pancake
pancake/motd.sh                                  /etc/profile.d/motd.sh                                    0755
pancake/nas-mount-check.sh                       /usr/local/sbin/nas-mount-check.sh                        0755
pancake/nas-mount-check.service                  /etc/systemd/system/nas-mount-check.service               0644  systemd
pancake/nas-mount-check.timer                    /etc/systemd/system/nas-mount-check.timer                 0644  systemd
pancake/speedtest-usb-routing.sh                 /usr/local/sbin/speedtest-usb-routing.sh                  0755
pancake/speedtest-usb-routing.service            /etc/systemd/system/speedtest-usb-routing.service         0644  systemd
pancake/speedtest-usb-routing.timer              /etc/systemd/system/speedtest-usb-routing.timer           0644  systemd
pancake/stack@arr.service.d/mounts.conf          /etc/systemd/system/stack@arr.service.d/mounts.conf       0644  systemd
pancake/stack@immich.service.d/mounts.conf       /etc/systemd/system/stack@immich.service.d/mounts.conf    0644  systemd
pancake/stack@music.service.d/order.conf         /etc/systemd/system/stack@music.service.d/order.conf      0644  systemd
pancake/stack@infra.service.d/order.conf         /etc/systemd/system/stack@infra.service.d/order.conf      0644  systemd

# charm
charm/motd.sh                                    /etc/profile.d/motd.sh                                    0755
charm/stack@infra.service.d/order.conf           /etc/systemd/system/stack@infra.service.d/order.conf      0644  systemd

# powder
powder/motd.sh                                   /etc/profile.d/motd.sh                                    0755
