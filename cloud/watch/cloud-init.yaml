#cloud-config
hostname: watch
manage_etc_hosts: true

users:
  - default
  - name: mez
    gecos: Mez
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 CHANGEME mez@laptop

ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - git
  - jq
  - openssh-server
  - python3
  - python3-venv

write_files:
  - path: /etc/ssh/sshd_config.d/50-watch-hardening.conf
    permissions: '0600'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "10m", "max-file": "3"},
        "live-restore": true
      }
  - path: /run/tailscale-authkey
    owner: root:root
    permissions: '0600'
    content: |
      tskey-auth-CHANGEME

runcmd:
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - [ sh, -c, "grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - systemctl restart ssh
  - systemctl enable --now docker
  - usermod -aG docker mez
  - [ sh, -c, "curl -fsSL https://tailscale.com/install.sh | sh" ]
  - [ sh, -c, "tailscale up --auth-key=$(tr -d '\\n' </run/tailscale-authkey) --hostname=watch --ssh --accept-dns=true" ]
  - rm -f /run/tailscale-authkey

final_message: "watch joined Tailscale; connect as mez@watch and run cloud/watch/bootstrap.sh"
