#cloud-config
hostname: powder
manage_etc_hosts: true

users:
  - default
  - name: mez
    gecos: Mez
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 CHANGEME mez@laptop

ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - gh
  - gnupg
  - jq
  - openssh-server
  - ripgrep
  - tmux
  - unzip
  - build-essential
  - unattended-upgrades
  - ufw
  - python3
  - python3-venv
  - uidmap
  - zsh

write_files:
  - path: /etc/ssh/sshd_config.d/50-powder-hardening.conf
    permissions: '0600'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
  - path: /etc/sysctl.d/90-powder-dev.conf
    permissions: '0644'
    content: |
      fs.inotify.max_user_watches=1048576
      fs.inotify.max_user_instances=1024
      vm.swappiness=10
  - path: /etc/systemd/system/fstrim.timer.d/override.conf
    permissions: '0644'
    content: |
      [Timer]
      OnCalendar=weekly
  - path: /etc/apt/apt.conf.d/52powder-unattended-upgrades
    permissions: '0644'
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
  - path: /run/tailscale-authkey
    owner: root:root
    permissions: '0600'
    content: |
      tskey-auth-CHANGEME
  - path: /usr/local/sbin/configure-powder-firewall
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu
      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow in on tailscale0
      ufw --force enable

runcmd:
  - install -d -o mez -g mez -m 0755 /home/mez/dev
  - [ sh, -c, "test -f /swapfile || fallocate -l 4G /swapfile" ]
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - [ sh, -c, "grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - [ sh, -c, "curl -fsSL https://tailscale.com/install.sh | sh" ]
  - [ sh, -c, "tailscale up --auth-key=$(tr -d '\\n' </run/tailscale-authkey) --hostname=powder --ssh --accept-dns=true" ]
  - rm -f /run/tailscale-authkey
  - /usr/local/sbin/configure-powder-firewall
  - loginctl enable-linger mez
  - systemctl restart ssh
  - sysctl --system
  - systemctl enable --now fstrim.timer

final_message: "powder joined Tailscale with public ingress closed; connect as mez and run cloud/powder/bootstrap.sh"
