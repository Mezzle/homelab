##############################################################################
# Mealie — self-hosted recipe manager and meal planner (https://mealie.io)
#
# Exposed publicly with Tailscale Funnel at https://pancake.corgi-justice.ts.net
# so people off the tailnet can use it. That URL works on the tailnet too.
# Funnel needs the "funnel" node attribute granted to tag:server in the
# Tailscale ACL.
#
# SQLite in a named volume (mealie_data). Mealie no longer backs itself up,
# so the backup container snapshots it to the NAS daily.
#
# No secrets: sign-up is disabled, and users join via invite links.
##############################################################################

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true

networks:
  mealie:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-mealie

volumes:
  data:

services:
  ##########################################################################
  # Mealie
  ##########################################################################
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    <<: *security-opts
    networks:
      - mealie
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      - "docktail.funnel.enable=true"
      - "docktail.funnel.port=9000"
      - "docktail.service.network=mealie_mealie"
    environment:
      TZ: Europe/London
      BASE_URL: https://pancake.corgi-justice.ts.net
      ALLOW_SIGNUP: "false"
    volumes:
      - data:/app/data
    logging: *default-logging

  ##########################################################################
  # Backup — SQLite snapshot + assets to the NAS on start and then every 24h
  #
  # Manual run: ./stack.sh backup
  ##########################################################################
  backup:
    image: alpine:3.21
    container_name: mealie-backup
    restart: unless-stopped
    <<: *security-opts
    networks:
      - mealie
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      TZ: Europe/London
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - data:/data:ro
      - ./scripts/backup.sh:/backup.sh:ro,z
      - /var/mnt/nas/backup:/nas:rslave
    entrypoint: /bin/sh
    command: ["-c", "apk add --no-cache sqlite bash tzdata && while true; do /bin/bash /backup.sh || true; sleep 86400; done"]
    # Unhealthy when the newest backup is over 26h old, which container-heartbeat
    # reports to Uptime Kuma as down.
    healthcheck:
      test: ["CMD-SHELL", "find /nas/backups/mealie -name 'mealie-*.tar.gz' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 2m
    logging: *default-logging
