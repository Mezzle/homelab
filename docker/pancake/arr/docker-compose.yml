##############################################################################
# arr stack — pancake (laptop)
#
# Prowlarr indexer searches route through a PIA VPN via gluetun's HTTP proxy.
# All services are exposed on Tailscale with automatic HTTPS.
# Media and backups live on the NAS, mounted on the host by systemd CIFS
# automounts (/var/mnt/nas/{media,backup}, see coreos/pancake.bu) and
# bind-mounted into containers. The seedbox is still mounted in Docker
# via rclone/SSHFS.
#
# Every bind of a network mount into a container needs rslave propagation,
# or the container holds a snapshot of the mount taken at start time and
# never sees a remount. /data/seedbox lacked it and would have been left
# holding a dead FUSE handle the first time rclone-seedbox restarted.
#
# Required:
#   - Copy .env.example to .env and fill in your values
#   - Place your seedbox SSH key at ./config/seedbox/id_rsa (or adjust path)
#   - After first boot, run: ./stack.sh bootstrap
##############################################################################

##############################################################################
# YAML anchors — shared config fragments
##############################################################################
x-common-env: &common-env
  PUID: 1001
  PGID: 1001
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true

##############################################################################
# Networks
##############################################################################
networks:
  arr:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-arr
  # Isolated network for Docker socket proxy — only autoheal can reach it
  socket-proxy:
    driver: bridge
    internal: true
  # Macvlan — gives containers a real IP on the LAN for mDNS/HomeKit.
  # ip_range constrains Docker's IPAM to the top of the /22 so it won't
  # collide with eero's DHCP pool (which can't be configured).
  lan:
    driver: macvlan
    driver_opts:
      parent: enp3s0
    ipam:
      config:
        - subnet: 192.168.4.0/22
          gateway: 192.168.4.1
          ip_range: 192.168.7.192/27

##############################################################################
# Services
##############################################################################
services:
  ##########################################################################
  # Remote mount: Seedbox via SSHFS (rclone)
  ##########################################################################
  rclone-seedbox:
    image: rclone/rclone:latest
    container_name: rclone-seedbox
    restart: unless-stopped
    networks:
      - arr
    cap_add:
      - SYS_ADMIN
    security_opt:
      - label=disable
    devices:
      - /dev/fuse
    deploy:
      resources:
        limits:
          memory: 3G
    environment:
      <<: *common-env
    volumes:
      - ./appdata/seedbox:/mnt/seedbox:z,shared
      - ./config/seedbox:/config/seedbox:ro,z
      # VFS cache lives on the idle 1TB HDD, not the container's overlay layer.
      # In the overlay it filled the SSD (14GB observed) and was destroyed on
      # every `compose up -d`, restarting in-flight imports from zero.
      #
      # Measured pipeline, 2026-08-22 — do not "optimise" the seedbox leg:
      #   seedbox -> pancake   64 MB/s 1 stream, 189 MB/s at 8 streams
      #   HDD cache write      86 MB/s
      #   pancake -> NAS       82.8 MB/s, IDENTICAL at 1 and 3 parallel writes
      # The Unraid NAS is a hard ceiling that does not scale with parallelism,
      # so extra seedbox streams (--vfs-read-chunk-streams) buy nothing
      # end-to-end. A real import measured 78 MB/s = ~94% of that ceiling.
      # Only a faster NAS moves this number.
      - /var/mnt/storage/cache/rclone:/cache
    command: >
      mount
        :sftp,host=${SEEDBOX_HOST},user=${SEEDBOX_USER},port=${SEEDBOX_PORT:-22},key_file=/config/seedbox/id_ed25519:${SEEDBOX_REMOTE_PATH}
        /mnt/seedbox
        --cache-dir /cache
        --vfs-cache-mode full
        --vfs-cache-max-size 100G
        --vfs-cache-max-age 24h
        --vfs-read-chunk-size 32M
        --vfs-read-chunk-size-limit 256M
        --vfs-read-ahead 256M
        --allow-other
        --allow-non-empty
        --dir-cache-time 5m
        --poll-interval 30s
        --log-level INFO
    # statfs on the FUSE mount: returns ENOTCONN if rclone has died, but
    # never makes a WAN round-trip. The old `ls` could time out on a link
    # blip, which had autoheal restart rclone and break the arr imports.
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "stat", "-f", "/mnt/seedbox" ]
      timeout: 20s
      retries: 5
    logging: *default-logging

  ##########################################################################
  # VPN: gluetun (PIA) — exposes an HTTP proxy on :8888 for Prowlarr
  ##########################################################################
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    networks:
      - arr
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      <<: *common-env
      VPN_SERVICE_PROVIDER: private internet access
      OPENVPN_USER: ${PIA_USER}
      OPENVPN_PASSWORD: ${PIA_PASS}
      SERVER_REGIONS: ${PIA_REGION:-Netherlands}
      # Built-in HTTP proxy on :8888 — Prowlarr tunnels indexer searches
      # through this instead of sharing gluetun's network namespace.
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "on"
    volumes:
      - ./config/gluetun:/gluetun:z
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9999" ]
      retries: 5
      start_period: 30s
    logging: *default-logging

  ##########################################################################
  # Prowlarr — on the arr network; searches proxied through gluetun:8888
  #
  # Proxy is applied per-indexer via a Prowlarr tag (see bootstrap.sh),
  # so only tracker search/grab traffic tunnels — everything else is direct.
  # depends_on is start-order only: if gluetun is down the UI and app-sync
  # still work, only searches fail, so the two are no longer coupled.
  ##########################################################################
  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    <<: *security-opts
    networks:
      - arr
    depends_on:
      - gluetun
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - 9696:9696
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=prowlarr"
      - "docktail.service.port=9696"
      - "docktail.service.service-port=443"
      - "docktail.service.network=arr_arr"
    environment:
      <<: *common-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./appdata/prowlarr:/config:z
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl", "-f", "http://localhost:9696/ping" ]
    logging: *default-logging

  ##########################################################################
  # Sonarr
  #
  # memory: 4G is deliberate. Imports sendfile() from the seedbox FUSE mount
  # to the NAS over CIFS, and the dirty CIFS page cache is charged to this
  # container's cgroup - not to the app's heap. At the old 1G ceiling that
  # OOM-killed the app mid-import 143 times in two months (killed processes
  # showed anon-rss:0kB). Paired with vm.dirty_bytes in
  # coreos/os-configs/sysctl-90-arr-tuning.conf, which caps dirty pages so
  # the page cache in here stays reclaimable.
  ##########################################################################
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    <<: *security-opts
    networks:
      - arr
    depends_on:
      rclone-seedbox:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - 8989:8989
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=sonarr"
      - "docktail.service.port=8989"
      - "docktail.service.service-port=443"
      - "docktail.service.network=arr_arr"
    environment:
      <<: *common-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./appdata/sonarr:/config:z
      - /var/mnt/nas/media:/data/media:rslave
      - ./appdata/seedbox:/data/seedbox:ro,rslave
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl", "-f", "http://localhost:8989/ping" ]
    logging: *default-logging

  ##########################################################################
  # Radarr
  #
  # memory: 4G is deliberate. Imports sendfile() from the seedbox FUSE mount
  # to the NAS over CIFS, and the dirty CIFS page cache is charged to this
  # container's cgroup - not to the app's heap. At the old 1G ceiling that
  # OOM-killed the app mid-import 143 times in two months (killed processes
  # showed anon-rss:0kB). Paired with vm.dirty_bytes in
  # coreos/os-configs/sysctl-90-arr-tuning.conf, which caps dirty pages so
  # the page cache in here stays reclaimable.
  ##########################################################################
  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: radarr
    restart: unless-stopped
    <<: *security-opts
    networks:
      - arr
    depends_on:
      rclone-seedbox:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - 7878:7878
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=radarr"
      - "docktail.service.port=7878"
      - "docktail.service.service-port=443"
      - "docktail.service.network=arr_arr"
    environment:
      <<: *common-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./appdata/radarr:/config:z
      - /var/mnt/nas/media:/data/media:rslave
      - ./appdata/seedbox:/data/seedbox:ro,rslave
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl", "-f", "http://localhost:7878/ping" ]
    logging: *default-logging

  ##########################################################################
  # Bazarr — automatic subtitle management
  ##########################################################################
  bazarr:
    image: ghcr.io/hotio/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    <<: *security-opts
    networks:
      - arr
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - 6767:6767
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=bazarr"
      - "docktail.service.port=6767"
      - "docktail.service.service-port=443"
      - "docktail.service.network=arr_arr"
    environment:
      <<: *common-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./appdata/bazarr:/config:z
      - /var/mnt/nas/media:/data/media:rslave
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl", "-f", "http://localhost:6767/ping" ]
    logging: *default-logging

  ##########################################################################
  # Recyclarr — syncs TRaSH Guides quality profiles on a schedule
  ##########################################################################
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:edge
    container_name: recyclarr
    restart: unless-stopped
    <<: *security-opts
    networks:
      - arr
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      <<: *common-env
      RECYCLARR_CRON: "0 */6 * * *"
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config:z
    logging: *default-logging

  ##########################################################################
  # Docker socket proxy — limits what autoheal can do with the socket
  ##########################################################################
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    networks:
      - socket-proxy
    deploy:
      resources:
        limits:
          memory: 128M
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      # Only grant the minimum permissions autoheal needs
      CONTAINERS: 1
      POST: 1
      # Everything else denied by default
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging

  ##########################################################################
  # Autoheal — restarts containers that fail healthchecks
  ##########################################################################
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    <<: *security-opts
    networks:
      - socket-proxy
    depends_on:
      - socket-proxy
    deploy:
      resources:
        limits:
          memory: 128M
    read_only: true
    tmpfs:
      - /tmp
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 120
      DOCKER_SOCK: tcp://socket-proxy:2375
    logging: *default-logging

  ##########################################################################
  # Backup — scheduled backups of app configs/databases to NAS
  #
  # Runs daily at 03:00. Backs up SQLite databases safely and keeps
  # 7 days of backups. Manual trigger: ./stack.sh backup
  ##########################################################################
  backup:
    image: alpine:3.21
    container_name: backup
    restart: unless-stopped
    <<: *security-opts
    networks:
      - arr
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      <<: *common-env
      BACKUP_RETENTION_DAYS: 7
      BACKUP_CRON: "0 3 * * *"
      BACKUP_VERIFY_CRON: "0 12 1 * *"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./appdata:/appdata:ro,z
      - ./scripts/backup.sh:/backup.sh:ro,z
      - /var/mnt/nas/backup:/nas:rslave
    entrypoint: /bin/sh
    command: >
      -c "
        apk add --no-cache sqlite bash curl &&
        { echo \"$${BACKUP_CRON} /bin/bash /backup.sh\"; echo \"$${BACKUP_VERIFY_CRON} /bin/bash /backup.sh --verify\"; } | crontab - &&
        crond -f -l 2
      "
    logging: *default-logging

  ##########################################################################
  # Plex
  ##########################################################################
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    <<: *security-opts
    networks:
      lan:
        ipv4_address: 192.168.7.222
        mac_address: C0:8D:8E:DC:E7:5A
      arr: ~
    # --- GPU hardware transcoding (uncomment ONE section) ---
    #
    # NVIDIA (requires nvidia-container-toolkit):
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=plex"
      - "docktail.service.port=32400"
      - "docktail.service.service-port=443"
      - "docktail.service.network=arr_arr"
    environment:
      <<: *common-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # Uncomment for NVIDIA GPU hardware transcoding
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - ./appdata/plex:/config:z
      - /var/mnt/nas/media:/media:ro,rslave
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl", "-f", "http://localhost:32400/identity" ]
      start_period: 30s
    logging: *default-logging

  ##########################################################################
  # Scrypted — Ring cameras → HomeKit bridge
  #
  # 5 cameras: 3× Stick Up Cam Battery, 1× Stick Up Cam Plus Battery,
  # 1× Doorbell Plus. Uses GPU for transcoding when available.
  ##########################################################################
  scrypted:
    image: ghcr.io/koush/scrypted:latest
    container_name: scrypted
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      lan:
        mac_address: 68:1C:85:C7:C6:CB
      arr: ~
    deploy:
      resources:
        limits:
          memory: 2G
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=scrypted"
      - "docktail.service.port=11080"
      - "docktail.service.service-port=443"
      - "docktail.service.network=arr_arr"
    environment:
      <<: *common-env
      SCRYPTED_DOCKER_AVAHI: "true"
    volumes:
      - ./appdata/scrypted:/server/volume:z
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl", "-sfk", "https://localhost:10443" ]
      start_period: 60s
    logging: *default-logging
