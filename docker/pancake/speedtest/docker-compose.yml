##############################################################################
# Speedtest Tracker — automated internet speed monitoring
#
# Runs periodic speedtests and graphs the results over time.
# Uses SQLite (no external database needed).
#
# Required:
#   - Copy .env.example to .env and fill in your values
#   - Generate APP_KEY: echo "base64:$(openssl rand -base64 32)"
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  speedtest:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-speedtest

services:
  ##########################################################################
  # Speedtest Tracker
  ##########################################################################
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest
    restart: unless-stopped
    networks:
      - speedtest
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=speedtest"
      - "docktail.service.port=80"
      - "docktail.service.service-port=443"
      - "docktail.service.network=speedtest_speedtest"
    environment:
      <<: *common-env
      PUID: 1000
      PGID: 1000
      APP_KEY: ${APP_KEY}
      SPEEDTEST_SCHEDULE: "12 * * * *"
      DB_CONNECTION: sqlite
      SPEEDTEST_SERVER_IDS: "48475"
    volumes:
      - ./appdata:/config:z
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      start_period: 30s
    logging: *default-logging
