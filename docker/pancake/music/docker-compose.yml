##############################################################################
# Music Assistant — music library management and streaming
#
# Uses macvlan for a real LAN IP so DLNA/Chromecast mDNS discovery works.
#
# Required:
#   - Copy .env.example to .env and fill in your values
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  music:
    driver: bridge
  # Macvlan — shared with arr stack for real LAN IPs (mDNS/Chromecast)
  lan:
    external: true
    name: arr_lan

services:
  ##########################################################################
  # Music Assistant
  # Macvlan gives it a real LAN IP for DLNA/Chromecast mDNS discovery.
  ##########################################################################
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - lan
      - music
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=music"
      - "docktail.service.port=8095"
      - "docktail.service.service-port=443"
      - "docktail.service.network=music_music"
    environment:
      <<: *common-env
    volumes:
      - ./appdata:/data:z
      - /mnt/storage/media/music:/media/music:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8095"]
      start_period: 30s
    logging: *default-logging
