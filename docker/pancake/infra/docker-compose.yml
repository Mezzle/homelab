##############################################################################
# Infrastructure stack — Portainer (Docker UI) + Diun (image update notifier)
#
# Portainer manages Docker containers/stacks via a web UI. Remote agents
# on charm and powder are connected over Tailscale.
#
# Diun watches all running containers for image updates and notifies
# via webhook/email/etc.
#
# Required:
#   - Copy .env.example to .env and fill in your values
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  infra:
    driver: bridge
  arr:
    name: arr_arr
    external: true
  immich:
    name: immich_immich
    external: true
  music:
    name: music_music
    external: true
  speedtest:
    name: speedtest_speedtest
    external: true

services:
  ##########################################################################
  # DockTail — exposes labelled Docker containers as Tailscale Services
  ##########################################################################
  docktail:
    image: ghcr.io/marvinvr/docktail:latest
    container_name: docktail
    restart: unless-stopped
    networks:
      - infra
      - arr
      - immich
      - music
      - speedtest
    security_opt:
      - no-new-privileges:true
      # uCore/CoreOS SELinux blocks Docker socket access without this.
      - label=disable
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale
    environment:
      TAILSCALE_OAUTH_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET}
      DEFAULT_SERVICE_TAGS: tag:service
    logging: *default-logging

  ##########################################################################
  # Portainer — Docker management UI
  #
  # Connect remote agents from the UI:
  #   Environments → Add → Agent
  #   URL: https://portainer-charm.<tailnet>.ts.net
  #   URL: https://portainer-powder.<tailnet>.ts.net
  ##########################################################################
  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    restart: unless-stopped
    networks:
      - infra
    security_opt:
      - label=disable
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=portainer"
      - "docktail.service.port=9443"
      - "docktail.service.protocol=https+insecure"
      - "docktail.service.service-port=443"
    environment:
      <<: *common-env
    volumes:
      - ./appdata/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=3", "--spider", "http://127.0.0.1:9000/api/system/status"]
    logging: *default-logging

  ##########################################################################
  # Homepage — dashboard for all homelab services
  #
  # Config files in config/homepage/ are committed to git.
  # API keys and secrets come from HOMEPAGE_VAR_* env vars.
  ##########################################################################
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - infra
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 100.100.100.100
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=homepage"
      - "docktail.service.port=3000"
      - "docktail.service.service-port=443"
    environment:
      <<: *common-env
      # Homepage reads HOMEPAGE_VAR_* from the environment automatically
      HOMEPAGE_VAR_TAILNET: ${TAILNET}
      HOMEPAGE_VAR_SONARR_API_KEY: ${SONARR_API_KEY:-}
      HOMEPAGE_VAR_RADARR_API_KEY: ${RADARR_API_KEY:-}
      HOMEPAGE_VAR_PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      HOMEPAGE_VAR_PLEX_TOKEN: ${PLEX_TOKEN:-}
      HOMEPAGE_VAR_IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      HOMEPAGE_VAR_ADGUARD_USER: ${ADGUARD_USER:-admin}
      HOMEPAGE_VAR_ADGUARD_PASS: ${ADGUARD_PASS:-}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost,homepage.${TAILNET}.ts.net}
      HOMEPAGE_VAR_PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
    volumes:
      - ./config/homepage:/app/config:z
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
    logging: *default-logging

  ##########################################################################
  # Diun — Docker Image Update Notifier
  #
  # Configure notifications in config/diun/diun.yml after first boot.
  # Supports: Discord, Slack, email, Gotify, ntfy, webhooks, etc.
  ##########################################################################
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    networks:
      - infra
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      <<: *common-env
      DIUN_WATCH_SCHEDULE: "0 6 * * *"
      DIUN_WATCH_JITTER: 30s
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
    volumes:
      - ./appdata/diun:/data:z
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "diun", "--version"]
    logging: *default-logging
