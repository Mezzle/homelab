##############################################################################
# Immich — self-hosted photo/video management with ML
#
# Photos live on the NAS, mounted on the host by a systemd CIFS automount
# (/var/mnt/nas/photos, see coreos/pancake.bu) and bind-mounted in.
# Hardware acceleration via extends files — swap backends by changing the
# extends: service: line (nvenc, quicksync, vaapi, cpu, etc.)
#
# Required:
#   - Copy .env.example to .env and fill in your values
#   - For NVIDIA: nvidia-container-toolkit installed on host
#   - NAS share accessible from this machine
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

networks:
  immich:
    driver: bridge

volumes:
  immich-db:
  immich-model-cache:

services:
  ##########################################################################
  # Immich Server
  #
  # Hardware transcoding: change extends → service to match your GPU.
  # Options: nvenc (NVIDIA), quicksync (Intel), vaapi, cpu
  ##########################################################################
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - label=disable
    extends:
      file: hwaccel.transcoding.yml
      service: ${IMMICH_TRANSCODING_BACKEND:-nvenc}
    networks:
      - immich
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - 2283:2283
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=immich"
      - "docktail.service.port=2283"
      - "docktail.service.service-port=443"
      - "docktail.service.network=immich_immich"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      DB_HOSTNAME: immich-db
      REDIS_HOSTNAME: immich-redis
    volumes:
      - /var/mnt/nas/photos:/data:rslave
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      disable: false
    logging: *default-logging

  ##########################################################################
  # Immich Machine Learning
  #
  # Hardware acceleration: change extends → service to match your GPU.
  # Options: cuda (NVIDIA), openvino (Intel), armnn, cpu
  ##########################################################################
  immich-ml:
    # For hardware acceleration, add suffix: -cuda, -rocm, -openvino, -armnn, -rknn
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}${IMMICH_ML_IMAGE_SUFFIX-}
    container_name: immich-ml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    extends:
      file: hwaccel.ml.yml
      service: ${IMMICH_ML_BACKEND:-cpu}
    networks:
      immich:
        aliases:
          - immich-machine-learning
    deploy:
      resources:
        limits:
          memory: 4G
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
    volumes:
      - immich-model-cache:/cache
    healthcheck:
      disable: false
    logging: *default-logging

  ##########################################################################
  # PostgreSQL (with pgvector + vectorchord for ML embeddings)
  #
  # Image pinned by SHA for reproducibility — update from Immich releases.
  ##########################################################################
  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-db
    restart: unless-stopped
    networks:
      - immich
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION:-./appdata/postgres}:/var/lib/postgresql/data:z
    healthcheck:
      disable: false
    logging: *default-logging

  ##########################################################################
  # Valkey (Redis-compatible) — pinned by SHA
  ##########################################################################
  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:3eeb09785cd61ec8e3be35f8804c8892080f3ca21934d628abc24ee4ed1698f6
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - immich
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    logging: *default-logging
