##############################################################################
# Home stack — MQTT, cameras, Zigbee, MySQL for Home Assistant
#
# Lightweight services that support Home Assistant on the Dell box.
# Runs on the Mac Mini (4GB RAM).
#
# Required:
#   - Copy .env.example to .env and fill in your values
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  home:
    driver: bridge

volumes:
  mysql-data:

services:
  ##########################################################################
  # Mosquitto — MQTT broker
  ##########################################################################
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - home
    security_opt:
      - no-new-privileges:true
    environment:
      MQTT_USER: ${MQTT_USER:-homeassistant}
      MQTT_PASS: ${MQTT_PASS}
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - 1883:1883
      - 9001:9001
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=mosquitto"
      - "docktail.service.port=1883"
      - "docktail.service.protocol=tcp"
      - "docktail.service.service-port=1883"
      - "docktail.service.service-protocol=tcp"
      - "docktail.service.network=home_home"
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro,z
      - ./appdata/mosquitto/data:/mosquitto/data:z
      - ./appdata/mosquitto/log:/mosquitto/log:z
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "mosquitto_pub -t healthcheck -n -p 1883 -u \"$${MQTT_USER}\" -P \"$${MQTT_PASS}\""]
    logging: *default-logging

  ##########################################################################
  # Zigbee2MQTT — Zigbee coordinator (network adapter)
  ##########################################################################
