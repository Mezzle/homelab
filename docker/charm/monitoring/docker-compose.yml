##############################################################################
# Monitoring stack — AdGuard Home (backup) + AG Sync
#
# Runs on the Mac Mini. AdGuard acts as a backup DNS instance, synced
# from the primary on the Raspberry Pi.
#
#
# Required:
#   - Copy .env.example to .env and fill in your values
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  monitoring:
    driver: bridge
  # Macvlan — gives AdGuard its own LAN IP so it can bind port 53
  # without conflicting with systemd-resolved on the host.
  # ip_range constrains Docker's IPAM to a separate slice from pancake
  # so macvlan IPs won't collide across hosts.
  lan:
    driver: macvlan
    driver_opts:
      parent: enp3s0f0
    enable_ipv6: true
    ipam:
      config:
        - subnet: 192.168.4.0/22
          gateway: 192.168.4.1
          ip_range: 192.168.7.224/27
        - subnet: fd6c:1476:be01:1::/64
          ip_range: fd6c:1476:be01:1:d0c:a000::/96

services:
  ##########################################################################
  # Cloudflare Tunnel — public DNS-over-HTTPS connector
  #
  # The tunnel's public hostname should route dns.mez.run to
  # http://adguard:80. Run another connector for the same tunnel beside the
  # Raspberry Pi primary to make the endpoint survive either host failing.
  ##########################################################################
  cloudflared:
    # Pin the multi-arch manifest; update this deliberately after testing.
    image: cloudflare/cloudflared:2026.8.0@sha256:2535e54b16adf1d50630f99d0886471926c5ef3f6b328100ec6589f731c48969
    container_name: cloudflared-doh
    profiles: [public-doh]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_DOH_TUNNEL_TOKEN:-}
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      adguard:
        condition: service_healthy
    logging: *default-logging

  ##########################################################################
  # AdGuard Home — backup DNS instance
  # Kept in sync with the primary on the Raspberry Pi via adguard-sync
  #
  # Runs on macvlan with its own LAN IP so port 53 doesn't conflict
  # with systemd-resolved on the host.
  ##########################################################################
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    hostname: adguard-backup
    restart: unless-stopped
    networks:
      monitoring:
      lan:
        mac_address: 02:A3:F7:1C:6E:4B
    security_opt:
      - no-new-privileges:true
    # Loopback-only backend for `tailscale serve --service=svc:dns` on charm.
    # This does not expose AdGuard on the LAN or Internet.
    ports:
      - "127.0.0.1:3080:80"
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=adguard-backup"
      - "docktail.service.port=80"
      - "docktail.service.service-port=443"
      - "docktail.service.network=monitoring_monitoring"
    volumes:
      - ./appdata/adguard/work:/opt/adguardhome/work:z
      - ./appdata/adguard/conf:/opt/adguardhome/conf:z
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
    logging: *default-logging

  ##########################################################################
  # AdGuard Home Sync — syncs config from Pi (primary) to here (replica)
  ##########################################################################
  adguard-sync:
    image: ghcr.io/bakito/adguardhome-sync:latest
    container_name: adguard-sync
    restart: unless-stopped
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      <<: *common-env
      # Primary (Raspberry Pi)
      ORIGIN_URL: ${ADGUARD_PRIMARY_URL}
      ORIGIN_USERNAME: ${ADGUARD_PRIMARY_USER}
      ORIGIN_PASSWORD: ${ADGUARD_PRIMARY_PASS}
      ORIGIN_INSECURE_SKIP_VERIFY: "true"
      
      # Replica (this instance)
      REPLICA1_URL: http://adguard:80
      REPLICA1_USERNAME: ${ADGUARD_REPLICA_USER}
      REPLICA1_PASSWORD: ${ADGUARD_REPLICA_PASS}
      # Sync every 30 minutes
      CRON: "*/30 * * * *"
      RUN_ON_START: "true"
    depends_on:
      adguard:
        condition: service_healthy
    logging: *default-logging
