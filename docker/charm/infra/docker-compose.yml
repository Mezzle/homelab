##############################################################################
# Infrastructure stack — Portainer agent
#
# Runs Portainer in agent mode so the primary Portainer instance on pancake
# can manage this server's containers from a single UI.
#
# Required:
#   - Copy .env.example to .env and fill in your values
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  infra:
    driver: bridge

services:
  ##########################################################################
  # DockTail — exposes labelled Docker containers as Tailscale Services
  ##########################################################################
  docktail:
    image: ghcr.io/marvinvr/docktail:latest
    container_name: docktail
    restart: unless-stopped
    networks:
      - infra
    security_opt:
      - no-new-privileges:true
      # uCore/CoreOS SELinux blocks Docker socket access without this.
      - label=disable
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale
    environment:
      TAILSCALE_OAUTH_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET}
      DEFAULT_SERVICE_TAGS: tag:service
    logging: *default-logging

  ##########################################################################
  # Portainer Agent
  #
  # Connect from the primary Portainer UI on pancake:
  #   Environments → Add → Agent
  #   URL: https://portainer-charm.<tailnet>.ts.net
  ##########################################################################
  portainer-agent:
    image: portainer/agent:alpine
    container_name: portainer-agent
    restart: unless-stopped
    networks:
      - infra
    security_opt:
      - label=disable
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=portainer-charm"
      - "docktail.service.port=9001"
      - "docktail.service.protocol=https+insecure"
      - "docktail.service.service-port=443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:9001/ping"]
    logging: *default-logging
