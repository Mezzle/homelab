##############################################################################
# Monitoring stack — External monitoring (Oracle Cloud)
#
# Runs outside the homelab so it can monitor and alert even when home
# machines are down. Connected via Tailscale mesh.
#
# Services:
#   - Uptime Kuma: monitors all homelab services over Tailscale
#
# Required:
#   - DockTail running on this Docker host (see docker/powder/infra)
##############################################################################

x-common-env: &common-env
  TZ: Europe/London

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  monitoring:
    driver: bridge

services:
  ##########################################################################
  # Uptime Kuma — external service monitoring
  #
  # Monitors all homelab services over Tailscale. Because it runs in the
  # cloud, it detects home internet/power outages that internal monitoring
  # would miss.
  ##########################################################################
  uptime-kuma:
    # Pinned to the 1.x line: 2.0 changes the database and the API the
    # seed scripts use. Diun reports new tags; bump deliberately.
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    # powder has a public IP; bind to the Tailscale address. The heartbeat
    # scripts push to http://powder:3001, which resolves to that address.
    ports:
      - ${TAILSCALE_IP:-0.0.0.0}:3001:3001
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=uptime-kuma"
      - "docktail.service.port=3001"
      - "docktail.service.service-port=443"
      # DockTail runs in the infra stack, so use the host-published port
      # rather than trying to reach this stack's private Docker network.
      - "docktail.service.direct=false"
    volumes:
      - ./appdata/uptime-kuma:/app/data:z
      # Discord now rejects Kuma's legacy timestamps and undefined field
      # values. Keep a small, defensive provider override until upstream
      # ships the equivalent fix.
      - ./overrides/discord.js:/app/server/notification-providers/discord.js:ro,z
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl", "-f", "http://localhost:3001/" ]
    logging: *default-logging

