##############################################################################
# Agent stack — Hermes Agent (Nous Research)
#
# Operational agent for the homelab. Runs off-site on powder so it can still
# observe (and report on) the on-site hosts when they are down.
#
# Interface is the web dashboard, published as a Tailscale Service by DockTail:
#   https://hermes.<tailnet>.ts.net
# There is no public ingress — the tailnet is the only way in, and the
# dashboard's own basic-auth gate sits behind that.
#
# See docs/hermes-agent-plan.md for the phased trust model.
#
# Required:
#   - DockTail running on this Docker host (see docker/powder/infra)
#   - .env populated from 1Password (scripts/sync-secrets.sh)
##############################################################################

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

networks:
  agent:
    driver: bridge

services:
  ##########################################################################
  # Hermes Agent — gateway + dashboard
  #
  # The container's main process is the gateway; the dashboard runs beside it
  # as a supervised s6 service, enabled by HERMES_DASHBOARD=1. This is the
  # upstream single-container shape, and it is not optional: a dashboard-only
  # container skips gateway supervision entirely (it detects its own role from
  # PID 1 argv), so the gateway can neither run nor be started from the UI.
  # Splitting them into two containers is supported only if they share a PID
  # and network namespace, which buys nothing here.
  #
  # A non-loopback bind makes the auth gate mandatory — the server fails
  # closed at startup if no auth provider is configured.
  #
  # The password is passed as plaintext rather than as the scrypt
  # PASSWORD_HASH Hermes also accepts: Compose interpolates `$` in .env
  # values, and a scrypt hash is `scrypt$N$r$p$salt$hash`, so the hash would
  # arrive with its `$` segments eaten. .env is 0600 and already holds every
  # other secret for this host in plaintext.
  ##########################################################################
  hermes:
    # Temporary derived image adding coalesced webhook incident sessions.
    # Dockerfile.hermes pins the compatible upstream digest; rebase the
    # override before changing it.
    build:
      context: .
      dockerfile: Dockerfile.hermes
    image: homelab/hermes-agent:webhook-coalescing
    container_name: hermes
    restart: unless-stopped
    networks:
      - agent
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3G
    ports:
      - 9119:9119
      # Uptime Kuma posts alert webhooks here; the gateway delivers them to
      # the configured Telegram home channel.
      - 8644:8644
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=hermes"
      - "docktail.service.port=9119"
      - "docktail.service.service-port=443"
      # DockTail runs in the infra stack, so use the host-published port
      # rather than trying to reach this stack's private Docker network.
      - "docktail.service.direct=false"
    environment:
      TZ: Europe/London
      # Own the data volume as the host `hermes` user (uid/gid 1002) rather
      # than root or mez.
      HERMES_UID: 1002
      HERMES_GID: 1002
      # Run the dashboard alongside the gateway. Host/port are pinned rather
      # than left to the image defaults because the bind decides whether the
      # auth gate engages at all — a loopback bind would silently disable it.
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: 9119
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      # Stable signing key — without it sessions are invalidated on restart.
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      HERMES_DASHBOARD_PUBLIC_URL: https://hermes.corgi-justice.ts.net
    command: ["gateway", "run"]
    volumes:
      - ./appdata/hermes:/opt/data:z
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://localhost:9119/api/status"]
    logging: *default-logging
